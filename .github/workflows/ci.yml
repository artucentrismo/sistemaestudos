name: Validate EstudosFlix

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/notebook-first-method-v3]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
