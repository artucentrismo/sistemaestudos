[package]
name = "sistemaestudos"
version = "0.1.0"
description = "EstudosFlix — GPS pedagógico offline"
authors = ["EstudosFlix"]
edition = "2021"

[lib]
name = "estudosflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }\nrusqlite = { version = "0.32", features = ["bundled"] }\nserde = { version = "1", features = ["derive"] }\nuuid = { version = "1", features = ["v4"] }\nchrono = { version = "0.4", features = ["serde"] }
