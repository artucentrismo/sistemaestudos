<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo</title>


<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#0e1a3a;--mu:#6b7794;--ac:#1b2f6b;--ln:#e3e8f2;--g:#2e9e6b;--rd:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#070d1f;--cd:#0f1a38;--tx:#eef1fa;--mu:#8a96b8;--ac:#7f9bff;--ln:#1c2850;--g:#4cc790;--rd:#ff7676}}
:root[data-theme="dark"]{--bg:#070d1f;--cd:#0f1a38;--tx:#eef1fa;--mu:#8a96b8;--ac:#7f9bff;--ln:#1c2850;--g:#4cc790;--rd:#ff7676}
:root[data-theme="light"]{--bg:#f3f5fa;--cd:#fff;--tx:#0e1a3a;--mu:#6b7794;--ac:#1b2f6b;--ln:#e3e8f2;--g:#2e9e6b;--rd:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:22px 20px 120px}
h1{font-family:"New York",Georgia,"Times New Roman",serif;font-size:34px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}h2{font-size:20px;margin:28px 0 12px}
.mu{color:var(--mu)}.sm{font-size:14px}.up{text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--mu);font-weight:600}
.card{background:var(--cd);border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(14,26,58,.05)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--cd);border-radius:18px;padding:16px}.tile b{display:block;font-family:"New York",Georgia,serif;font-size:28px;margin-top:4px}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;margin-top:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .btn{color:#070d1f}}
.btn.s{background:var(--ln);color:var(--tx)}.btn:disabled{opacity:.35}
.lk{background:none;border:0;color:var(--ac);font-size:16px;padding:8px 6px}.lk.r{color:var(--rd)}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--ln);font-size:17px}
.row:first-child{border-top:0}.f{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.c{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);flex:none;display:grid;place-items:center;color:var(--cd)}
.on .c{background:var(--ac);border-color:var(--ac)}
.chip{display:inline-block;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);border-radius:999px;padding:5px 12px;margin:3px 5px 3px 0;font-size:15px}
.chip button{background:none;border:0;color:inherit;padding:0 0 0 6px;font-size:15px}
.stp{display:flex;gap:18px;margin-top:10px}.stp div{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:6px 8px 6px 14px;font-size:15px}
.stp button,.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:20px}
.ib{width:34px;height:34px;font-size:15px;margin-left:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln)}
.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--mu);font-size:12px;padding:6px}.tabs button b{display:block;font-size:22px;font-weight:400}.tabs .a{color:var(--ac)}
input,select,textarea{font:inherit;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);width:100%;margin-top:8px}
.ob{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.ob h1{font-size:42px}.ob p{font-size:19px;color:var(--mu);line-height:1.45}
.opt{text-align:left;background:var(--cd);border:2px solid transparent;border-radius:18px;padding:20px;margin-top:12px;font-size:16px;width:100%;color:var(--tx)}.opt.on{border-color:var(--ac)}.opt b{display:block;font-size:19px;margin-bottom:4px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:6px;min-height:4px;margin-bottom:4px}
.pill{background:var(--ac);color:var(--cd);border:0;border-radius:999px;padding:10px 20px;font-size:16px;font-weight:700}.hero{background:#1b2f6b;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.badge{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;font-weight:700;font-family:Georgia,serif}.ach{display:inline-block;border-radius:14px;padding:8px 12px;margin:4px 6px 4px 0;font-size:15px;background:color-mix(in srgb,#ffb703 22%,transparent)}.ach.no{background:var(--ln);opacity:.5;filter:grayscale(1)}.pl{display:inline-block;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--ln);position:relative;flex:none}.sw i{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--g)}.sw.on i{left:22px}.lg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:6px}

#anki-v2{margin-top:14px}
.anki-topline{display:flex;justify-content:space-between;color:var(--mu);font-size:10px;letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.anki-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.anki-stats>div{background:var(--cd);border-radius:14px;padding:12px;min-width:0}
.anki-stats small{display:block;color:var(--mu);font-size:11px}
.anki-stats b{display:block;font-size:23px;margin-top:4px}
.anki-actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.anki-actions button,.anki-toolbar button,.anki-footer-actions button,.anki-note button,.anki-section-head button,.anki-review-head button{border:1px solid var(--ln);border-radius:11px;padding:11px 9px;background:var(--cd);color:var(--tx);font:inherit;font-size:13px}
.anki-primary{border:0!important;background:var(--ac)!important;color:#fff!important;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;width:100%}
.anki-primary:disabled{opacity:.35}
.anki-toolbar{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin:14px 0}
.anki-toolbar input,.anki-toolbar select,.anki-form input,.anki-form textarea,.anki-form select{margin:0;font-size:14px;padding:11px}
.anki-section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.anki-section-head span,.anki-muted{color:var(--mu);font-size:13px}
.anki-list{background:var(--cd);border-radius:16px;padding:4px 14px}
.anki-note{display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--ln)}
.anki-note:last-child{border-bottom:0}
.anki-note-copy{flex:1;min-width:0}
.anki-note-copy b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.anki-note-copy small{display:block;color:var(--mu);font-size:11px;margin-top:4px}
.anki-note button{padding:7px 9px;min-width:32px}
.anki-footer-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.anki-footer-actions button{font-size:12px}
.anki-form,.anki-review-card,.anki-empty{background:var(--cd);border-radius:18px;padding:18px;margin-top:14px}
.anki-form label{display:block;color:var(--mu);font-size:12px;font-weight:700;margin:12px 0}
.anki-form textarea{display:block;width:100%;margin-top:6px;resize:vertical}
.anki-form input,.anki-form select{display:block;width:100%;margin-top:6px}
.anki-empty{text-align:center;padding:28px 18px}
.anki-empty h2{margin:0 0 8px}
.anki-empty p{color:var(--mu);font-size:14px;line-height:1.5}
.anki-message,.anki-error{font-size:13px;margin:10px 0;color:var(--g)}
.anki-error{color:var(--rd)}
.anki-review-head{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px}
.anki-review-card{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:16px 0}
.anki-review-card small{color:var(--mu);font-size:12px}
.anki-question{font-family:Georgia,serif;font-size:25px;line-height:1.45;white-space:pre-wrap;margin:28px 0}
.anki-answer{font-size:19px;line-height:1.5;white-space:pre-wrap}
.anki-cloze-gap{color:var(--ac)}
.anki-cloze-answer{color:var(--g)}
.anki-grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.anki-grade-grid p{grid-column:1/-1;color:var(--mu);text-align:center;font-size:13px}
.anki-grade-grid button{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:12px 4px;font:inherit}
.anki-grade-grid button b,.anki-grade-grid button small{display:block}
.anki-grade-grid button small{font-size:10px;color:var(--mu);margin-top:5px}
@media(max-width:430px){.anki-stats{grid-template-columns:repeat(2,1fr)}.anki-actions{grid-template-columns:1fr 1fr}.anki-actions .anki-primary{grid-column:1/-1}.anki-toolbar{grid-template-columns:1fr}.anki-note{gap:4px}.anki-note button{padding:7px 6px}.anki-grade-grid{gap:5px}.anki-grade-grid button{font-size:13px}}

.theme-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-choice button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px 7px;font:inherit;font-size:14px;font-weight:650}
.theme-choice button.active{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 18%,transparent)}
.anki-local-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:5px}
.anki-welcome{display:flex;align-items:center;justify-content:space-between;padding:20px 4px 18px}
.anki-welcome h2{font-size:30px;margin:4px 0}
.anki-welcome p{margin:0;color:var(--mu);font-size:14px}
.anki-eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--ac)}
.anki-welcome-icon{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--ac) 13%,var(--cd));display:grid;place-items:center;color:var(--ac);font-size:30px}
.anki-stats>div{border:1px solid var(--ln);box-shadow:0 2px 8px rgba(10,20,40,.035)}
.anki-actions{grid-template-columns:1.45fr 1fr 1fr;gap:9px}
.anki-actions button{min-height:48px;cursor:pointer;transition:transform .15s,opacity .15s}
.anki-actions button:active,.anki-tree-item:active{transform:scale(.98)}
.anki-actions button:disabled{opacity:.4}
.anki-deck-tree{margin:18px 0 14px;padding:12px;background:var(--cd);border:1px solid var(--ln);border-radius:18px}
.anki-tree-heading{display:flex;justify-content:space-between;padding:2px 8px 9px;color:var(--mu);font-size:10px;font-weight:800;letter-spacing:.12em}
.anki-tree-heading span{font-weight:500;letter-spacing:0}
.anki-tree-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px 11px calc(12px + var(--deck-depth,0)*17px);border:0;border-radius:11px;background:transparent;color:var(--tx);text-align:left;font:inherit;font-size:14px;cursor:pointer}
.anki-tree-item.active{background:color-mix(in srgb,var(--ac) 12%,var(--cd));color:var(--ac);font-weight:750}
.anki-tree-icon{width:20px;color:var(--ac);font-size:16px;flex:none}
.anki-tree-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anki-tree-arrow{color:var(--mu)}
.anki-toolbar{grid-template-columns:1fr auto;align-items:center}
.anki-toolbar input{min-width:0;border-radius:13px}
.anki-toolbar button{white-space:nowrap}
.anki-section-head{margin-top:22px}
.anki-list{border:1px solid var(--ln);padding:3px 14px}
.anki-note{gap:8px;padding:14px 0}
.anki-note-copy b{font-size:14px;white-space:normal;line-height:1.35}
.anki-note-copy small{line-height:1.45}
.anki-note button{min-width:36px;min-height:36px;border-radius:10px;background:var(--bg);cursor:pointer}
.anki-note button:hover,.anki-toolbar button:hover,.anki-footer-actions button:hover{border-color:var(--ac)}
.anki-form{border:1px solid var(--ln);box-shadow:0 8px 28px rgba(10,20,40,.06);padding:20px}
.anki-form-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.anki-form-title small{color:var(--ac);font-size:10px;font-weight:800;letter-spacing:.14em}
.anki-form-title h3{font-size:21px;margin:3px 0 0}
.anki-icon-button{width:38px;height:38px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-size:23px;cursor:pointer}
.anki-form label{margin:14px 0;color:var(--tx);font-size:13px}
.anki-form input,.anki-form select{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:13px;font-size:15px}
.anki-field-card{border:1px solid var(--ln);border-radius:16px;padding:14px;margin:14px 0;background:var(--bg)}
.anki-front-field{border-left:4px solid var(--ac)}
.anki-back-field{border-left:4px solid var(--g)}
.anki-field-heading{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.anki-field-number{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--ac) 13%,var(--cd));color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:800}
.anki-back-field .anki-field-number{background:color-mix(in srgb,var(--g) 13%,var(--cd));color:var(--g)}
.anki-field-heading b,.anki-field-heading small{display:block}
.anki-field-heading b{font-size:14px}
.anki-field-heading small{color:var(--mu);font-size:11px;margin-top:2px}
.anki-field-card textarea{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;min-height:130px;line-height:1.55;font-size:16px;resize:vertical;margin:0}
.anki-back-field textarea{min-height:110px}
.anki-field-card textarea:focus,.anki-form input:focus,.anki-form select:focus{outline:2px solid color-mix(in srgb,var(--ac) 35%,transparent);border-color:var(--ac)}
.anki-field-footer{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:9px;color:var(--mu);font-size:11px}
.anki-field-footer button{border:1px solid var(--ln);border-radius:9px;padding:7px 9px;background:var(--cd);color:var(--ac);font:inherit;font-size:11px;font-weight:700}
.anki-form .anki-primary{margin-top:8px}
.anki-muted{line-height:1.5}
.anki-deck-form{margin:14px 0}
.anki-danger-zone{border-top:1px solid var(--ln);margin-top:22px;padding-top:16px}
.anki-danger-zone p{font-size:13px;line-height:1.5;color:var(--mu)}
.anki-danger-button{width:100%;border:1px solid color-mix(in srgb,var(--rd) 35%,var(--ln));background:color-mix(in srgb,var(--rd) 8%,var(--cd));color:var(--rd);border-radius:12px;padding:12px;font:inherit;font-weight:700}
.anki-secondary{border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);padding:12px 16px;font:inherit}
.anki-empty-inline{padding:26px 12px;text-align:center}
.anki-empty-inline b,.anki-empty-inline span{display:block}
.anki-empty-inline span{font-size:13px;color:var(--mu);margin-top:5px}
.anki-empty-symbol{font-size:34px;color:var(--ac);margin-bottom:8px}
.anki-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:32px;color:var(--mu);font-size:14px}
.anki-loading span{width:15px;height:15px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:anki-spin .8s linear infinite}
@keyframes anki-spin{to{transform:rotate(360deg)}}
.anki-review-progress{height:5px;background:var(--ln);border-radius:9px;overflow:hidden;margin:13px 0}
.anki-review-progress i{display:block;height:100%;background:var(--ac);transition:width .2s}
.anki-review-card{border:1px solid var(--ln);box-shadow:0 8px 28px rgba(10,20,40,.05);padding:24px;min-height:300px}
.anki-question{font-family:inherit;font-weight:650;font-size:23px;line-height:1.5}
.anki-answer{font-size:18px;line-height:1.65}
.anki-answer-divider{height:1px;background:var(--ln);width:100%;margin:8px 0 18px}
.anki-tap-hint{font-size:12px;color:var(--mu);margin-top:24px}
.anki-grade-grid button{min-height:72px;cursor:pointer}
.anki-grade-grid button:nth-of-type(1){border-color:#e58b8b;background:#b93845;color:#fff}
.anki-grade-grid button:nth-of-type(1) small{color:#ffe5e7}
.anki-grade-grid button:nth-of-type(2){border-color:#d89a32;background:#f3bd55;color:#382400}
.anki-grade-grid button:nth-of-type(2) small{color:#593b08}
.anki-grade-grid button:nth-of-type(3){border-color:#248b68;background:#269b70;color:#fff}
.anki-grade-grid button:nth-of-type(3) small{color:#e3fff3}
.anki-grade-grid button:nth-of-type(4){border-color:#326fc0;background:#397fdb;color:#fff}
.anki-grade-grid button:nth-of-type(4) small{color:#e8f2ff}
.anki-grade-grid button:active{transform:scale(.98)}
.profile-card{background:linear-gradient(135deg,#1b2f6b,#3456a8);color:#fff;border-radius:18px;padding:16px 18px;margin:12px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.profile-card .profile-name{font-size:18px;font-weight:800}.profile-card small{display:block;color:rgba(255,255,255,.75);margin-top:4px}
.backup-card{border:1px solid color-mix(in srgb,#248b68 35%,var(--ln));background:color-mix(in srgb,#248b68 7%,var(--cd));border-radius:16px;padding:14px;margin:14px 0}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.backup-actions button{flex:1;min-width:130px;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:750;cursor:pointer}
.backup-download{background:#248b68;color:#fff}.backup-import{background:#326fc0;color:#fff}
.profile-inputs{display:grid;gap:10px;text-align:left;margin:20px 0}
.profile-inputs label{font-size:13px;font-weight:700;color:var(--mu)}
.profile-inputs input{margin-top:6px}
.game-bonus{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,#ffb703 20%,var(--cd));color:var(--tx);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;margin:4px 0 10px}
@media(max-width:430px){
 .theme-choice button{font-size:12px;padding:11px 3px}
 .anki-actions{grid-template-columns:1fr 1fr}
 .anki-actions .anki-primary{grid-column:1/-1}
 .anki-toolbar{grid-template-columns:1fr}
 .anki-toolbar button{width:100%}
 .anki-note{gap:5px}
 .anki-note button{min-width:32px;padding:6px}
 .anki-form{padding:15px}
 .anki-field-card{padding:11px}
 .anki-field-card textarea{font-size:16px}
 .anki-question{font-size:21px}
 .anki-review-card{padding:18px;min-height:260px}
}

/* Ciclo visual refresh — inspired by the Canva concept, without Canva runtime dependencies. */
:root{
  --bg:#edf2ed;--cd:#ffffff;--tx:#172b31;--mu:#52666d;--ac:#245e72;
  --ln:#d5e1df;--g:#218768;--rd:#a9443b;--surface2:#eef4f1;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#081a33;--cd:#153455;--tx:#f5f8f6;--mu:#aebfcb;--ac:#c2e9ff;
    --ln:#385061;--g:#68cba3;--rd:#f3b6a5;--surface2:#213747;
  }
}
:root[data-theme="dark"]{
  --bg:#081a33;--cd:#153455;--tx:#f5f8f6;--mu:#aebfcb;--ac:#c2e9ff;
  --ln:#385061;--g:#68cba3;--rd:#f3b6a5;--surface2:#213747;
}
:root[data-theme="light"]{
  --bg:#edf2ed;--cd:#ffffff;--tx:#172b31;--mu:#52666d;--ac:#245e72;
  --ln:#d5e1df;--g:#218768;--rd:#a9443b;--surface2:#eef4f1;
}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;background:
    radial-gradient(ellipse at 82% 0%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 42%),
    var(--bg);
  color:var(--tx);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(circle,color-mix(in srgb,var(--ac) 50%,transparent) .7px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
main{position:relative;z-index:1;max-width:1080px;padding:26px clamp(16px,3vw,34px) 140px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,4vw,42px);font-weight:700;letter-spacing:-.035em;line-height:1.12;margin:0 0 8px}
h2{font-size:21px;font-weight:750;letter-spacing:-.02em;margin:30px 0 14px}
.up{font-size:11px;letter-spacing:.13em;font-weight:800}
.mu{color:var(--mu)}
.card{
  background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:22px;
  padding:22px;margin-bottom:15px;box-shadow:0 12px 34px rgba(5,20,32,.07);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.tile{
  background:linear-gradient(145deg,var(--cd),var(--surface2));color:var(--tx);
  border:1px solid var(--ln);border-radius:19px;padding:17px;box-shadow:0 8px 22px rgba(5,20,32,.045);
}
.tile b{font-family:Georgia,"Times New Roman",serif;font-size:30px;letter-spacing:-.03em}
.grid{gap:13px;margin-bottom:15px}
.btn{
  width:auto;min-height:46px;padding:13px 19px;border:1px solid transparent;border-radius:13px;
  background:var(--ac);color:#fff;font-size:15px;font-weight:750;cursor:pointer;
  box-shadow:0 5px 14px color-mix(in srgb,var(--ac) 18%,transparent);
  transition:transform .16s,filter .16s,box-shadow .16s;
}
:root[data-theme="dark"] .btn{color:#14251e}
:root[data-theme="dark"] .btn.s, :root[data-theme="dark"] .theme-choice button.active{color:#14251e}
@media(prefers-color-scheme:dark){
  :root:not([data-theme]) .btn.s{color:var(--tx)}
  :root:not([data-theme]) .theme-choice button.active{color:#14251e}
}

@media(prefers-color-scheme:dark){:root:not([data-theme]) .btn{color:#14251e}}
:root[data-theme="light"] .btn{color:#fff}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--ac) 22%,transparent)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.s{background:var(--surface2);color:var(--tx);border-color:var(--ln);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.lk{color:var(--ac);font-weight:650}
.lk.r{color:var(--rd)}
.bar{height:8px;background:var(--surface2);border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.bar i{border-radius:99px;background:var(--ac)}
.row{border-color:var(--ln);font-size:15px}
.c{border-color:var(--ln)}
.stp div{background:var(--surface2)}
.stp button,.ib{background:var(--surface2);border:1px solid var(--ln);cursor:pointer;transition:background .15s,transform .15s}
.stp button:hover,.ib:hover{background:color-mix(in srgb,var(--ac) 16%,var(--surface2))}
.pill{background:var(--ac);color:#14251e;font-size:13px;padding:9px 15px}
:root[data-theme="light"] .pill{color:#fff}
.hero{background:linear-gradient(135deg,#153455,#245d75);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);border-radius:23px;padding:24px;box-shadow:0 14px 36px rgba(5,20,32,.13)}
.badge{border-color:var(--ln);background:var(--surface2);color:var(--mu)}
.pl{background:color-mix(in srgb,var(--ac) 16%,var(--cd));color:var(--tx);border:1px solid var(--ln)}
.ach{border:1px solid color-mix(in srgb,#e5a72e 35%,var(--ln));font-weight:650}
.ach.no{background:var(--surface2);border-color:var(--ln);color:var(--mu)}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--ln);border-radius:12px;color:var(--tx);
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 75%,white)!important;outline-offset:3px}
.tabs{
  left:50%;right:auto;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));
  width:min(720px,calc(100% - 28px));justify-content:space-around;gap:5px;padding:8px;
  background:color-mix(in srgb,var(--cd) 90%,transparent);border:1px solid var(--ln);
  border-radius:22px;box-shadow:0 14px 40px rgba(3,15,28,.2);z-index:100;
}
.tabs button{max-width:none;flex:1;border-radius:15px;padding:8px 5px;font-size:11px;font-weight:650;transition:background .15s,color .15s}
.tabs button b{font-size:21px;line-height:1.2;margin-bottom:3px}
.tabs button:hover{background:var(--surface2);color:var(--tx)}
.tabs .a{background:var(--ac);color:#14251e}
:root[data-theme="light"] .tabs .a{color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .tabs .a{color:#14251e}}
.profile-card{border:1px solid rgba(194,233,255,.2);box-shadow:0 12px 30px rgba(5,20,32,.16)}
.backup-card{
  border:1px solid color-mix(in srgb,var(--g) 42%,var(--ln));
  background:color-mix(in srgb,var(--g) 8%,var(--cd));border-radius:19px;padding:18px;
}
.backup-actions button{border-radius:12px;min-height:44px;transition:filter .15s,transform .15s}
.backup-actions button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.backup-download{background:#218768;color:#fff}
.backup-import{background:#326fc0;color:#fff}
.game-bonus{border:1px solid color-mix(in srgb,#e5a72e 38%,var(--ln))}
#anki-v2{margin-top:18px}
.anki-stats>div,.anki-list,.anki-form,.anki-review-card,.anki-empty,.anki-deck-tree{
  background:var(--cd);border-color:var(--ln);color:var(--tx);border-radius:19px;
}
.anki-stats>div{box-shadow:0 8px 22px rgba(5,20,32,.055)}
.anki-note{border-color:var(--ln)}
.anki-note button,.anki-toolbar button,.anki-footer-actions button,.anki-review-head button{
  background:var(--surface2);border-color:var(--ln);color:var(--tx);cursor:pointer;
}
.anki-form input,.anki-form select,.anki-form textarea{background:var(--surface2);color:var(--tx)}
.anki-primary{background:var(--ac)!important;color:#14251e!important;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 20%,transparent)}
:root[data-theme="light"] .anki-primary{color:#fff!important}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .anki-primary{color:#14251e!important}}
.anki-tree-item.active{background:color-mix(in srgb,var(--ac) 16%,var(--cd));color:var(--tx)}
.anki-field-card{background:var(--surface2);border-color:var(--ln)}
.anki-field-card textarea{background:var(--cd);color:var(--tx)}
@media(min-width:760px){
  main{padding-top:34px}
  .tabs{bottom:18px}
  .card{padding:25px}
}
@media(max-width:560px){
  main{padding:20px 14px 126px}
  .card{padding:17px;border-radius:19px}
  .grid{gap:9px}
  .tile{padding:14px}
  .tile b{font-size:26px}
  .btn{width:100%;padding:13px 14px}
  .tabs{width:calc(100% - 20px);bottom:max(8px,env(safe-area-inset-bottom,0px));border-radius:19px}
  .tabs button{font-size:10px}
  .tabs button b{font-size:19px}
  .backup-actions{display:grid;grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
